name: README

on:
  push:
    branches: [ main ]

jobs:
  build-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          install.packages(c(
            "devtools",
            "rmarkdown"
          ))
        shell: Rscript {0}

      - name: Build README
        run: devtools::build_readme()
        shell: Rscript {0}

      - name: Commit README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update README"
