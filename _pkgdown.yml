url: https://ymbouamboua.github.io/GnRHcell/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: GnRHcell
  description: >
    Detection, characterization, developmental staging, visualization,
    validation, and reporting of gonadotropin-releasing hormone neurons
    in single-cell RNA-sequencing datasets.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      aria-label: GitHub repository
      href: https://github.com/ymbouamboua/GnRHcell

reference:
  - title: Main workflow
    desc: >
      High-level functions for running the complete GnRH-neuron detection,
      staging, diagnostic, and reporting workflow.
    contents:
      - run_gnrh
      - gnrh_report

  - title: GnRH-neuron detection and staging
    desc: >
      Input validation, detection, classification, and developmental-stage
      assignment.
    contents:
      - validate_input
      - detect_gnrh
      - stage_gnrh
      - gnrh_diagnostics

  - title: Marker discovery and biological programs
    desc: >
      GnRH-lineage and stage-specific marker discovery, developmental
      programs, co-expression, and cross-dataset overlap.
    contents:
      - gnrh_markers
      - find_gnrh_genes
      - find_gnrh_stage_markers
      - gnrh_stage_modules
      - gnrh_stage_gene_references
      - build_gene_sets
      - gene_upset
      - gnrh_marker_programs

  - title: Multi-dataset workflows
    desc: >
      Preparation, processing, comparison, and validation of single-cell
      dataset collections.
    contents:
      - prepare_gnrh_datasets
      - run_gnrh_dataset
      - run_gnrh_collection
      - compare_gnrh_datasets
      - validate_gnrh_collection
      - extract_gnrh_run_info

  - title: Visualization
    desc: >
      Publication-ready cellular embeddings, expression plots, diagnostic
      summaries, distributions, networks, and cross-dataset figures.
    contents:
      - plot_gnrh_embedding
      - plot_gnrh_feature
      - plot_gnrh_dot
      - plot_gnrh_distribution
      - plot_gnrh_hits
      - plot_gnrh_coexpr
      - plot_gnrh_specificity
      - plot_class_counts
      - plot_network
      - plot_gnrh_marker_programs
      - plot_gnrh_runtime_curve
      - plot_gnrh_detected

  - title: Colors
    desc: Stable color palettes for GnRHcell classifications and stages.
    contents:
      - gnrh_colors

  - title: Example data
    desc: Sampled Seurat objects and reference data for examples and testing.
    contents:
      - hpsc

articles:
  - title: Vignettes
    navbar: Vignettes
    contents:
      - GnRHcell
      - demo-results
