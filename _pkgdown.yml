url: https://ymbouamboua.github.io/GnRHcell/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: GnRHcell
  description: >
    Detection, characterization, developmental staging, visualization,
    and reporting of gonadotropin-releasing hormone neurons in
    single-cell RNA-sequencing datasets.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      aria-label: GitHub repository
      href: https://github.com/ymbouamboua/GnRHcell

reference:
  - title: Main workflow
    desc: >
      High-level functions for running the complete GnRH-neuron detection,
      staging, diagnostic, and reporting workflow.
    contents:
      - run_gnrh
      - gnrh_report

  - title: GnRH-neuron detection and staging
    desc: >
      Detection, classification, input validation, and developmental-stage
      assignment.
    contents:
      - detect_gnrh
      - stage_gnrh
      - validate_input

  - title: Marker discovery and programs
    desc: >
      Identification of GnRH-specific genes, marker programs,
      co-expression patterns, and cross-dataset overlap.
    contents:
      - find_gnrh_genes
      - gene_upset
      - gnrh_stage_gene_references
      - matches("marker")
      - matches("gene_set")
      - matches("module")

  - title: Diagnostics and quality control
    desc: >
      Diagnostic summaries and quality-control functions.
    contents:
      - gnrh_diagnostics

  - title: Visualization
    desc: >
      Visualization of cellular embeddings, expression, stages,
      co-expression patterns, and distributions.
    contents:
      - celldot
      - cellfeature
      - cellmap
      - cellviolin
      - dark_theme
      - matches("^plot_")
      - matches("^gnrh_plot")

  - title: Colors and themes
    desc: >
      Color palettes and graphical helpers.
    contents:
      - cellpal
      - gnrh_colors

  - title: Example data
    desc: >
      Example datasets distributed with GnRHcell.
    contents:
      - hpsc_gnrh

  - title: Scores and classification
    desc: >
      Functions for computing detection scores, classification confidence,
      and developmental-stage scores.
    contents:
      - matches("score")
      - matches("classif")

  - title: Data extraction and summaries
    desc: >
      Extraction and summarization of GnRHcell results.
    contents:
      - starts_with("extract_")
      - starts_with("get_")
      - matches("summary")

articles:
  - title: Vignettes
    navbar: Vignettes
    contents:
      - GnRHcell
